networks:
  ch-net:
    driver: bridge

services:
  # 1. MinIO (S3)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9090:9000"
      - "9091:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    networks:
      - ch-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. бакет
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - ch-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/clickhouse-backups --ignore-existing;
      echo 'Bucket created successfully';
      exit 0;
      "

  # 3. ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8124:8123"
      - "9002:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse-config/config.d:/etc/clickhouse-server/config.d:ro
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_SKIP_USER_SETUP=1
    networks:
      - ch-net
    depends_on:
      minio:
        condition: service_healthy

  # 4. clickhouse-backup
  clickhouse-backup:
    image: altinity/clickhouse-backup:latest
    container_name: clickhouse-backup
    volumes:
      - ./backup-config/config.yml:/etc/clickhouse-backup/config.yml:ro
      - ch_data:/var/lib/clickhouse
    networks:
      - ch-net
    depends_on:
      - clickhouse
    entrypoint: ["sleep", "infinity"]

volumes:
  ch_data:
